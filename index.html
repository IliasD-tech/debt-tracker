<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1f24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Debt">
<title>Debt Tracker</title>
<link rel="manifest" href="manifest.json">
<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#1b1f24; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; --bad:#dc2626; --good:#16a34a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1216; --card:#181c22; --ink:#e8eaed; --muted:#9aa3ad; --line:#262b33; --accent:#60a5fa; --bad:#f87171; --good:#4ade80; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--ink); padding-bottom: env(safe-area-inset-bottom); }
  header { padding: 16px; font-size: 20px; font-weight: 600; display:flex; justify-content:space-between; align-items:center; }
  header button { font-size: 13px; }
  main { padding: 0 12px 40px; max-width: 640px; margin: 0 auto; }
  section { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  h2 { font-size: 15px; margin: 0 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-top:1px solid var(--line); gap:8px; }
  .row:first-of-type { border-top:none; }
  .name { font-weight:600; }
  .sub { font-size:12px; color:var(--muted); }
  .amt { font-variant-numeric: tabular-nums; font-weight:600; text-align:right; }
  .neg { color: var(--bad); }
  .pos { color: var(--good); }
  .warn { background: #fef3c7; color:#78350f; border-radius:8px; padding:8px; font-size:13px; margin-bottom:8px; }
  @media (prefers-color-scheme: dark) { .warn { background:#3b2f0b; color:#fde68a; } }
  button { font: inherit; border:none; border-radius:10px; padding:8px 12px; background:var(--accent); color:#fff; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--line); }
  button.danger { background:transparent; color:var(--bad); border:1px solid var(--line); }
  input, select { font: inherit; width:100%; padding:9px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); }
  label { font-size:12px; color:var(--muted); display:block; margin: 8px 0 4px; }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap:8px; }
  .actions { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  dialog { border:none; border-radius:16px; width: min(440px, 94vw); background:var(--card); color:var(--ink); padding:18px; }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .total { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .small { font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <span>Debt Tracker</span>
  <span class="actions">
    <button class="ghost" id="exportBtn">Export</button>
    <button class="ghost" id="importBtn">Import</button>
    <input type="file" id="importFile" accept="application/json" hidden>
  </span>
</header>
<main>
  <section>
    <h2>Total owed</h2>
    <div class="total" id="total"></div>
    <div class="small" id="totalSub"></div>
  </section>

  <section id="warnings"></section>

  <section>
    <h2>Accounts</h2>
    <div id="accounts"></div>
    <div class="actions" style="margin-top:8px"><button class="ghost" id="addAccount">+ Account</button></div>
  </section>

  <section>
    <h2>Cards</h2>
    <div id="cards"></div>
    <div class="actions" style="margin-top:8px"><button id="addCard">+ Card</button></div>
  </section>

  <section>
    <h2>Log a payment</h2>
    <div class="grid">
      <div><label>Card</label><select id="payCard"></select></div>
      <div><label>Amount</label><input id="payAmt" type="number" step="0.01" inputmode="decimal"></div>
      <div><label>Date</label><input id="payDate" type="date"></div>
      <div><label>From account</label><select id="payFrom"></select></div>
    </div>
    <div class="actions" style="margin-top:10px"><button id="logPay">Log payment</button></div>
  </section>

  <section>
    <h2>Payoff plan (avalanche)</h2>
    <div class="grid">
      <div><label>Monthly income</label><input id="income" type="number" step="0.01" inputmode="decimal"></div>
      <div><label>Fixed bills</label><input id="fixed" type="number" step="0.01" inputmode="decimal"></div>
      <div><label>Total minimum payments</label><input id="minTotal" type="number" step="0.01" disabled></div>
      <div><label>Extra for debt</label><input id="extraDebt" type="number" step="0.01" disabled></div>
    </div>
    <div class="small" style="margin-top:6px">Extra for debt = income minus fixed bills minus total minimums. Anything above the minimums goes to your highest-APR card.</div>
    <div id="plan" style="margin-top:10px"></div>
  </section>

  <section>
    <h2>Recent payments</h2>
    <div id="history"></div>
  </section>
</main>

<dialog id="cardDialog">
  <form method="dialog" id="cardForm">
    <h2 id="cardTitle">Card</h2>
    <label>Name</label><input id="cName" required>
    <div class="grid">
      <div><label>Balance</label><input id="cBal" type="number" step="0.01" required></div>
      <div><label>APR %</label><input id="cApr" type="number" step="0.01"></div>
      <div><label>Minimum due</label><input id="cMin" type="number" step="0.01"></div>
      <div><label>Due date</label><input id="cDue" type="date"></div>
    </div>
    <label>Credit limit (optional)</label><input id="cLimit" type="number" step="0.01">
    <div class="actions" style="margin-top:14px">
      <button type="button" class="danger" id="cDelete">Delete</button>
      <button type="button" class="ghost" id="cCancel">Cancel</button>
      <button type="submit">Save</button>
    </div>
  </form>
</dialog>

<dialog id="accountDialog">
  <form method="dialog" id="accountForm">
    <h2 id="accountTitle">Account</h2>
    <label>Name</label><input id="aName" required>
    <label>Balance (negative for overdrawn)</label><input id="aBal" type="number" step="0.01" required>
    <div class="actions" style="margin-top:14px">
      <button type="button" class="danger" id="aDelete">Delete</button>
      <button type="button" class="ghost" id="aCancel">Cancel</button>
      <button type="submit">Save</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
